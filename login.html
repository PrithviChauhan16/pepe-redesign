<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEPE KUN | Log In & Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] }, colors: { brand: { 900: '#1a1a1a' } } } } }
    </script>
    <style>
        body { 
            background-color: #fff3ff;
            background-image: url('pepekun-original-bg.png'); 
            background-repeat: repeat;
            background-size: 300px;
            background-attachment: fixed;
        }
        @media (min-width: 768px) { body { background-size: 500px; } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-12px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 4s ease-in-out infinite; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="text-brand-900 antialiased selection:bg-pink-200 flex items-center justify-center min-h-screen p-4">

    <!-- Floating Auth Card -->
    <div class="bg-white/80 backdrop-blur-md p-8 md:p-10 rounded-[3rem] shadow-2xl border border-white animate-float w-full max-w-md transition-all duration-500">
        
        <a href="index.html" class="text-sm font-medium text-gray-500 hover:text-pink-500 transition-colors mb-6 inline-block">
            ← Back to Shop
        </a>
        
        <!-- Toggle Tabs -->
        <div class="flex bg-gray-100 rounded-full p-1 mb-8">
            <button onclick="toggleForm('login')" id="tab-login" class="flex-1 py-2 text-sm font-semibold rounded-full bg-white shadow text-gray-900 transition-all">Log In</button>
            <button onclick="toggleForm('signup')" id="tab-signup" class="flex-1 py-2 text-sm font-semibold rounded-full text-gray-500 hover:text-gray-900 transition-all">Sign Up</button>
        </div>

        <!-- Log In Form -->
        <form id="form-login" class="space-y-6 block" onsubmit="handleLogin(event)">
            <div class="text-center mb-6">
                <h2 class="text-3xl font-semibold mb-1">Welcome Back</h2>
                <p class="text-gray-500 font-light text-sm">Use admin@pepekun.com / admin123 for dashboard.</p>
            </div>
            <input type="email" id="login-email" placeholder="Email Address" class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-300 focus:ring-2 focus:ring-pink-100 bg-white/90 text-sm" required>
            <input type="password" id="login-password" placeholder="Password" class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-300 focus:ring-2 focus:ring-pink-100 bg-white/90 text-sm" required>
            <button type="submit" class="w-full py-4 bg-brand-900 text-white rounded-full font-medium hover:bg-pink-500 transition-colors shadow-lg">Sign In</button>
        </form>

        <!-- Sign Up Form (Hidden by default) -->
        <form id="form-signup" class="space-y-4 hidden" onsubmit="event.preventDefault(); alert('Account created! Redirecting...'); window.location.href='index.html';">
            <div class="text-center mb-6">
                <h2 class="text-3xl font-semibold mb-1">Join the Family</h2>
                <p class="text-gray-500 font-light text-sm">Create an account to track your companions.</p>
            </div>
            <input type="text" placeholder="Full Name" class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-300 focus:ring-2 focus:ring-pink-100 bg-white/90 text-sm" required>
            <input type="email" placeholder="Email Address" class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-300 focus:ring-2 focus:ring-pink-100 bg-white/90 text-sm" required>
            <input type="password" placeholder="Create Password" class="w-full px-5 py-4 rounded-2xl border border-gray-200 focus:outline-none focus:border-pink-300 focus:ring-2 focus:ring-pink-100 bg-white/90 text-sm" required>
            <button type="submit" class="w-full py-4 bg-brand-900 text-white rounded-full font-medium hover:bg-pink-500 transition-colors shadow-lg mt-2">Create Account</button>
        </form>

    </div>

<script>
    // --- Initialize Supabase ONCE ---
    const supabaseUrl = 'https://cmxhngjykgoqblobyefh.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; 
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    // Tab Toggle UI Function
    function toggleForm(type) {
        const loginForm = document.getElementById('form-login');
        const signupForm = document.getElementById('form-signup');
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');

        if (type === 'login') {
            loginForm.classList.remove('hidden'); signupForm.classList.add('hidden');
            tabLogin.classList.add('bg-white', 'shadow', 'text-gray-900'); tabLogin.classList.remove('text-gray-500');
            tabSignup.classList.remove('bg-white', 'shadow', 'text-gray-900'); tabSignup.classList.add('text-gray-500');
        } else {
            signupForm.classList.remove('hidden'); loginForm.classList.add('hidden');
            tabSignup.classList.add('bg-white', 'shadow', 'text-gray-900'); tabSignup.classList.remove('text-gray-500');
            tabLogin.classList.remove('bg-white', 'shadow', 'text-gray-900'); tabLogin.classList.add('text-gray-500');
        }
    }

    // --- Supabase Login Logic ---
    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password,
        });

        if (error) {
            alert("Login failed: " + error.message);
            return;
        }

        if (email === 'admin@pepekun.com') {
            window.location.href = 'admin.html';
        } else {
            window.location.href = 'index.html';
        }
    }

    // --- Supabase Sign Up Logic ---
    document.getElementById('form-signup').addEventListener('submit', async function(e) {
        e.preventDefault();
        const inputs = this.querySelectorAll('input');
        const fullName = inputs[0].value;
        const email = inputs[1].value;
        const password = inputs[2].value;

        const { data, error } = await supabase.auth.signUp({
            email: email,
            password: password,
            options: { data: { full_name: fullName } }
        });

        if (error) {
            alert("Sign up failed: " + error.message);
        } else {
            alert("Account created successfully! You are now logged in.");
            window.location.href = 'index.html';
        }
    });
</script>
</body>
</html>
